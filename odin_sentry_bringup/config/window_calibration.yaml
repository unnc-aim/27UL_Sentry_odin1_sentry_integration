# Capture paths are relative to --data-root. All output goes to a new --output directory.
reference_mode: optical_axis
observation_face_offset_m: 0.0
reference_offset_uncertainty_m: 0.03
imu_height_m: 0.43
wall_top_is_level: true
# Reviewed against all four saved images in workflow_geometry_review/geometry_review.png.
image_reviewed: true
minimum_frame_coverage: 0.8
methods: [offset, scale, piecewise]
model:
  min_confidence: 35
  min_raw_gap_m: 0.01
  min_gain: 0.2
  max_gain: 6.0
  direction_tolerance_deg: 0.15
filter:
  min_confidence: 35
  max_range_m: 4.0
  self_radius_m: 0.15
  neighbor_radius_m: 0.04
  reference_neighbors: 20
  filter_range_m: 4.0
evaluation:
  distance_error_p95_m: 0.05
  minimum_direction_coverage: 0.8
  minimum_object_points: 3
  minimum_object_frame_fraction: 0.95
  minimum_point_retention_fraction: 0.95
  obstacle_height_min_m: 0.10
  obstacle_height_max_m: 0.55
