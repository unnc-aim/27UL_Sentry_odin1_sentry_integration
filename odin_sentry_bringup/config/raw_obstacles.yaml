odin_raw_obstacles:
  ros__parameters:
    # Device T_IL comes from /odin1/wiwc; poses come from the high-frequency IMU odometry.
    max_stamp_age: 0.3
    max_future_stamp: 0.05
    max_pose_gap: 0.02
    pose_position_tolerance: 0.05
    pose_angle_tolerance: 0.05
    min_confidence: 35
    max_range: 3.0
    self_filter_radius: 0.15
    # Keep the SLAM-specific empirical box out of the raw path.
    # Use 20 other points at 1 m, increasing as 20 / range^2 closer to the IMU.
    # Check the full raw obstacle range; the reference remains one meter.
    # Range is the 3D distance in meters; the neighborhood remains 4 cm.
    near_outlier_range: 3.0
    near_outlier_radius: 0.04
    near_outlier_min_neighbors: 20
    near_outlier_scale_by_range: true
